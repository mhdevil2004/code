workflows:
  nuclear-ipa:
    name: Nuclear IPA Build
    environment:
      flutter: stable
      xcode: latest
    
    scripts:
      - name: Nuclear Clean
        script: |
          rm -rf *
          git clone https://github.com/flutter/flutter.git . || true
          
      - name: Create Hello World
        script: |
          cat > pubspec.yaml << 'EOL'
          name: hello_world_ipa
          environment: 
            sdk: ">=2.19.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
          EOL
          
          mkdir -p lib
          cat > lib/main.dart << 'EOL'
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('HELLO IPA!')))));
          EOL
          
      - name: Build IPA
        script: |
          flutter create --org com.hello --platforms=ios --overwrite .
          flutter build ipa --release --no-codesign
          
      - name: Force Artifacts
        script: |
          mkdir -p artifacts
          cp build/ios/ipa/*.ipa artifacts/ || echo "Copying IPA"
          ls -la artifacts/
    
    artifacts:
      - artifacts/**/*
      - build/ios/ipa/**/*