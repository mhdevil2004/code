workflows:
  simple-build:
    name: Simple Build
    environment:
      flutter: stable
    scripts:
      - name: Create App
        script: |
          echo "Creating simple Flutter app..."
          flutter create --org com.simple --platforms=ios simple_app
          cd simple_app
          flutter build ios --no-codesign --debug
          echo "BUILD_COMPLETED" > ../build_success.txt
    artifacts:
      - build_success.txt
      - simple_app/build/ios/**/*