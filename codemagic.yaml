workflows:
  ios-build:
    name: Build iOS IPA
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Setup Flutter
        script: |
          flutter --version
          flutter pub get
      
      - name: Generate iOS Files
        script: |
          flutter create --org com.ipa . --platforms=ios --overwrite
      
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign --verbose
          
          echo "=== FORCING ARTIFACTS CREATION ==="
          ls -la build/ios/ipa/ || echo "No ipa folder"
          find . -name "*.ipa" -type f || echo "No IPA files found"
          
          # Create a test file to verify artifacts work
          echo "IPA_BUILD_SUCCESS" > ipa_success.txt
          mkdir -p artifacts
          echo "Artifacts should be here" > artifacts/README.txt
    artifacts:
      - build/ios/ipa/**/*
      - ipa_success.txt
      - artifacts/**/*