workflows:
  real-ipa-build:
    name: Real IPA Build
    environment:
      flutter: "3.16.0"  # Specific version
      xcode: "15.2"      # Specific version
      cocoapods: "1.15.2"
    
    scripts:
      - name: Clean Setup
        script: |
          echo "=== CLEAN SETUP ==="
          flutter clean
          rm -rf ios android
          
      - name: Create Fresh iOS Project
        script: |
          echo "=== CREATING iOS PROJECT ==="
          flutter create --org com.yourcompany --platforms=ios --overwrite .
          ls -la ios/
          
      - name: Build REAL IPA
        script: |
          echo "=== BUILDING REAL IPA ==="
          cd ios
          pod install || echo "Pods might already be installed"
          cd ..
          flutter build ipa --release --no-codesign --verbose
          
      - name: Verify REAL IPA
        script: |
          echo "=== CHECKING FOR REAL IPA ==="
          find . -name "*.ipa" -type f
          ls -la build/ios/ipa/
          if [ -f "build/ios/ipa/*.ipa" ]; then
            echo "REAL_IPA_CREATED" > IPA_SUCCESS.txt
          else
            echo "NO_IPA_FOUND" > IPA_FAILED.txt
          fi
    
    artifacts:
      - build/ios/ipa/**/*
      - IPA_SUCCESS.txt
      - IPA_FAILED.txt