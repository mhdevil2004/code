workflows:
  debug-ipa:
    name: Debug IPA Build
    environment:
      flutter: stable
      xcode: latest
    
    scripts:
      - name: Show Exact Error
        script: |
          echo "=== STARTING DEBUG BUILD ==="
          pwd
          ls -la
          
          # Create minimal Flutter project
          cat > pubspec.yaml << 'EOL'
name: hello_debug
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
EOL

          mkdir -p lib
          cat > lib/main.dart << 'EOL'
import 'package:flutter/material.dart';
void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('HELLO')))));
EOL

          echo "=== BEFORE FLUTTER CREATE ==="
          ls -la
          
      - name: Create iOS Project
        script: |
          echo "=== CREATING iOS PROJECT ==="
          flutter create --org com.debug --platforms=ios --overwrite .
          echo "Flutter create exit code: $?"
          
          echo "=== AFTER FLUTTER CREATE ==="
          ls -la ios/ || echo "NO IOS FOLDER"
          
      - name: Try to Build
        script: |
          echo "=== ATTEMPTING BUILD ==="
          flutter build ipa --release --no-codesign --verbose || echo "BUILD FAILED"
          
          echo "=== CHECKING RESULTS ==="
          find . -name "*.ipa" -type f 2>/dev/null | head -5 || echo "NO IPA FILES"
          ls -la build/ 2>/dev/null || echo "NO BUILD FOLDER"
          
      - name: Create Dummy Artifact
        script: |
          echo "CREATING DUMMY FILE TO TEST ARTIFACTS"
          echo "If you see this file, artifacts work but build failed" > artifact_test.txt
          mkdir -p dummy_artifacts
          echo "dummy content" > dummy_artifacts/dummy_file.txt
    
    artifacts:
      - artifact_test.txt
      - dummy_artifacts/**/*