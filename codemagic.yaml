workflows:
  build-ios:
    name: Build iOS IPA last
    environment:
      flutter: stable
    scripts:
      - name: Debug Structure
        script: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== Looking for pubspec.yaml ==="
          find . -name "pubspec.yaml" -type f
          echo "=== Looking for iOS folder ==="
          find . -name "ios" -type d
    artifacts:
      - build/ios/ipa/*.ipa