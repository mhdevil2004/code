workflows:
  build-ios:
    name: Build iOS IPA
    environment:
      flutter: "3.16.0"  # Specific version
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup
        script: |
          flutter --version
          flutter pub get
          
      - name: Build iOS
        script: |
          cd ios
          pod install
          cd ..
          flutter build ipa --release --no-codesign --verbose
    artifacts:
      - build/ios/ipa/*.ipa