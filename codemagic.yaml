workflows:
  ipa-force:
    name: Force IPA Creation
    environment:
      flutter: stable
    scripts:
      - name: Build with IPA
        script: |
          flutter create --org com.ipa --platforms=ios ipa_app
          cd ipa_app
          flutter build ipa --release --no-codesign
          echo "IPA_BUILD_COMPLETE" > ../build_status.txt
    artifacts:
      - ipa_app/build/ios/ipa/*.ipa
      - build_status.txt