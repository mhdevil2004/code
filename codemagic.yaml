workflows:
  ios-build:
    name: Build iOS IPA 
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Setup Flutter
        script: |
          flutter --version
          flutter pub get
      
      - name: Build iOS IPA
        script: |
          set -e
          flutter clean
          flutter build ipa --release --no-codesign --export-options-plist ExportOptions.plist
          echo "IPA build completed!"
          
      - name: Verify Artifacts
        script: |
          set -e
          find build -name "*.ipa" -type f
          ls -la build/ios/ipa/
          ls build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true