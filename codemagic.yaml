workflows:
  simple-ipa:
    name: Simple IPA Demo
    environment:
      flutter: stable
    scripts:
      - name: Create IPA Structure
        script: |
          mkdir -p ipa_folder/build/ios/ipa
          echo "This is a demo IPA file" > ipa_folder/build/ios/ipa/app.ipa
          echo "Build completed successfully" > ipa_folder/build/ios/ipa/status.txt
          ls -la ipa_folder/build/ios/ipa/
    artifacts:
      - ipa_folder/build/ios/ipa/**/*