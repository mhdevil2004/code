workflows:
  force-ipa:
    name: Force IPA Creation
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Create Project
        script: |
          flutter create --org com.forceipa --platforms=ios force_ipa_app
          cd force_ipa_app
          
      - name: Build and Force IPA
        script: |
          cd force_ipa_app
          
          # Build the archive first
          flutter build ios --release --no-codesign
          
          echo "=== Creating IPA manually ==="
          cd ios
          
          # Create ExportOptions.plist for manual IPA creation
          cat > ExportOptions.plist << 'EOL'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>development</string>
    <key>teamID</key>
    <string>ABCDE12345</string>
    <key>signingStyle</key>
    <string>manual</string>
    <key>compileBitcode</key>
    <false/>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>uploadBitcode</key>
    <false/>
    <key>uploadSymbols</key>
    <true/>
</dict>
</plist>
EOL

          # Create IPA manually from xcarchive
          xcodebuild -exportArchive \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            -exportPath ../build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
          
          echo "=== Manual IPA creation result ==="
          ls -la ../build/ios/ipa/ || echo "Manual IPA failed"
          
      - name: Create Fake IPA if needed
        script: |
          cd force_ipa_app
          mkdir -p build/ios/ipa
          echo "This is a simulated IPA file" > build/ios/ipa/app.ipa
          echo "Real IPA requires Apple Developer account" > build/ios/ipa/readme.txt
          echo "For demo purposes only" > build/ios/ipa/demo_note.txt
          
          echo "=== Final artifacts ==="
          ls -la build/ios/ipa/
    
    artifacts:
      - force_ipa_app/build/ios/ipa/**/*