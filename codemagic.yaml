workflows:
  ios-build:
    name: Build iOS IPA workflows
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Setup Flutter
        script: |
          flutter --version
          flutter pub get
      
      - name: Generate iOS Files
        script: |
          echo "=== Current iOS structure ==="
          ls -la ios/ || echo "No ios folder found"
          
          echo "=== Generating iOS project files ==="
          flutter create --org com.ipa . --platforms=ios --overwrite
          
          echo "=== iOS structure after generation ==="
          ls -la ios/
          find ios/ -name "*.xcodeproj" -type d
      
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign --verbose
    artifacts:
      - build/ios/ipa/*.ipa