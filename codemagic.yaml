workflows:
  real-ipa:
    name: Real IPA Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Create Project
        script: |
          flutter create --org com.realipa --platforms=ios real_ipa_app
          cd real_ipa_app
          
      - name: Build REAL IPA
        script: |
          cd real_ipa_app
          # This command creates .ipa file
          flutter build ipa --release --no-codesign
          echo "=== CHECKING FOR IPA ==="
          find . -name "*.ipa" -type f
          ls -la build/ios/ipa/
          
      - name: Force IPA Creation
        script: |
          cd real_ipa_app
          # If above fails, use xcodebuild directly
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/Runner.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportPath build/ipa -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates
          echo "=== XCODE IPA ==="
          find . -name "*.ipa" -type f
    
    artifacts:
      - real_ipa_app/build/ios/ipa/*.ipa
      - real_ipa_app/ios/build/ipa/*.ipa