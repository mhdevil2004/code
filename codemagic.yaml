workflows:
  build-ios:
    name: Build iOS IPA
    environment:
      flutter: stable
    scripts:
      - name: Build App
        script: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files present ==="
          ls -la
          flutter pub get
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa